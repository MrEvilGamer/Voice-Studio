[package]
name = "voice-studio"
version = "0.1.0"
description = "Real-time AI microphone enhancement studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "voice_studio"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
rtrb = "0.3"
rubato = "0.15"
winreg = "0.52"
log = { version = "0.4", features = ["alloc"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
